[package]
name = "ferroreport-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferroreport = { path = "../crates/ferroreport" }
serde_json = "1"
chrono = { version = "0.4", default-features = false }

# Not part of the main workspace: `cargo fuzz` builds it on its own.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "template"
path = "fuzz_targets/template.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expression"
path = "fuzz_targets/expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rows"
path = "fuzz_targets/rows.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query"
path = "fuzz_targets/query.rs"
test = false
doc = false
bench = false
