<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="230" rx="14" fill="#fbfaf7" stroke="#e4e7ee"/>
  <text x="24" y="38" font-size="18" font-weight="700" fill="#10151f">Time to render a 2-page invoice (process start → PDF on disk)</text>
  <text x="24" y="60" font-size="13" fill="#5b6474">Same JRXML and data · 2-vCPU Linux VM · median of 5 runs · lower is better</text>
  <text x="24" y="104" font-size="15" font-weight="600" fill="#10151f">JasperReports 6.20</text>
  <rect x="200" y="88" width="460" height="24" rx="6" fill="#9aa3b2"/>
  <text x="670" y="106" font-size="15" font-weight="700" fill="#10151f">3.01 s</text>
  <text x="24" y="152" font-size="15" font-weight="600" fill="#10151f">ferroreport</text>
  <rect x="200" y="136" width="4" height="24" rx="2" fill="#e8590c"/>
  <text x="214" y="154" font-size="15" font-weight="700" fill="#e8590c">0.010 s  — ~300× faster, 16 MiB instead of 194 MiB</text>
  <text x="24" y="200" font-size="13" fill="#5b6474">20,000 rows / 477 pages: 7.22 s → 0.39 s (19×), 489 MiB → 52 MiB. Reproduce with tools/bench.py.</text>
</svg>
