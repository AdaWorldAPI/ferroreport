name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Once a week too: new advisories appear without anyone pushing.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --exclude ferroreport-python -- -D warnings
      - run: cargo test

  # Known vulnerabilities, licenses and sources of every dependency (deny.toml).
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cargo clippy -p ferroreport-python -- -D warnings
      - run: pip install maturin pytest
      - run: maturin build --release -m bindings/python/Cargo.toml -o dist
      - run: pip install dist/*.whl && pytest -q bindings/python/tests

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo build --release -p ferroreport-cli
      - run: mvn -B -q -f bindings/java/pom.xml verify
        env:
          FERROREPORT_BIN: ${{ github.workspace }}/target/release/ferroreport

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: |
          V=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          echo "WASM_BINDGEN=wasm-bindgen-cli@$V" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.WASM_BINDGEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bindings/wasm/build.sh
      - run: node bindings/wasm/tests/smoke.mjs

  # What the server promises about large reports (tools/http_check.py says what).
  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ferroreport-cli
      - run: python3 tools/http_check.py --rows 100000 --clients 20

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ferroreport:ci .
      - name: Build the image releases publish, from the same binary
        run: |
          mkdir -p dist
          docker create --name bin ferroreport:ci
          docker cp bin:/ferroreport dist/ferroreport-linux-amd64
          docker rm bin
          docker build -t ferroreport:release -f Dockerfile.release .
      - name: Smoke-test the HTTP API
        run: |
          # Without a token the server refuses to listen beyond localhost.
          if docker run --rm ferroreport:ci; then echo 'started without a token'; exit 1; fi
          for image in ferroreport:ci ferroreport:release; do
            # No memory for documents: every one goes through a file, which proves that the
            # image has somewhere to write (it is built from nothing, as a user that is not root).
            docker run -d --name fr -p 8080:8080 -e FERROREPORT_TOKEN=ci-secret -e FERROREPORT_SPOOL_MEMORY=0 $image
            for i in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
            python3 - <<'EOF'
          import json, urllib.request
          tpl = open("fixtures/01-employee-list/report.jrxml").read()
          data = json.load(open("fixtures/01-employee-list/data.json"))
          def render(body, kind, **more):
              req = urllib.request.Request("http://localhost:8080/render", method="POST", data=body,
                  headers={"Content-Type": kind, "Authorization": "Bearer ci-secret", **more})
              return urllib.request.urlopen(req).read()
          whole = render(json.dumps({"template": tpl, "now": "2026-01-15T10:30:00", "data": data}).encode(), "application/json")
          assert whole.startswith(b"%PDF"), whole[:200]
          lines = (json.dumps({"template": tpl, "now": "2026-01-15T10:30:00"}) + "\n" + "".join(json.dumps(r) + "\n" for r in data)).encode()
          assert render(lines, "application/x-ndjson") == whole
          assert render(lines, "application/x-ndjson", Prefer="respond-streaming") == whole
          print("ok", len(whole))
          EOF
            docker logs fr 2>&1 | tail -5
            if docker logs fr 2>&1 | grep -q 'no writable temporary directory'; then echo 'the image has nowhere to write'; exit 1; fi
            docker rm -f fr
          done
