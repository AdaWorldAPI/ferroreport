name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Once a week too: new advisories appear without anyone pushing.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --exclude ferroreport-python -- -D warnings
      - run: cargo test

  # The oldest Rust the library promises to build with (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.86
      - run: cargo check --locked -p ferroreport --lib

  # Known vulnerabilities, licenses and sources of every dependency (deny.toml).
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The database drivers against real servers: PostgreSQL, MariaDB and SQL Server.
  databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-pw
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-pw
          MARIADB_DATABASE: fr
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect" --health-interval 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only-pw-2026
        ports: ["1433:1433"]
    env:
      FERROREPORT_TEST_POSTGRES: postgres://postgres:ci-only-pw@127.0.0.1:5432/postgres
      FERROREPORT_TEST_MYSQL: mysql://root:ci-only-pw@127.0.0.1:3306/fr
      FERROREPORT_TEST_MSSQL: sqlserver://127.0.0.1:1433;user=sa;password=Ci-only-pw-2026;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ferroreport-cli
      # SQL Server takes a while to start and has no health check in its image.
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null && break
            sleep 2
          done
          sleep 10
      - run: cargo test --release -p ferroreport-cli db::tests -- --test-threads=1
      # The same report from each database gives the same document as from SQLite.
      - name: The SQL fixture from every database
        run: |
          python3 -c "import sqlite3; c = sqlite3.connect('/tmp/fx.sqlite'); c.executescript(open('fixtures/48-sql/data.sql').read()); c.commit()"
          docker run --rm --network host -e PGPASSWORD=ci-only-pw -v "$PWD/fixtures/48-sql:/fx" postgres:16 psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE fx" -q
          docker run --rm --network host -e PGPASSWORD=ci-only-pw -v "$PWD/fixtures/48-sql:/fx" postgres:16 psql -h 127.0.0.1 -U postgres -d fx -q -f /fx/data.sql
          docker run --rm --network host -v "$PWD/fixtures/48-sql:/fx" mariadb:11 sh -c "mariadb -h 127.0.0.1 -uroot -pci-only-pw --default-character-set=utf8mb4 fr < /fx/data.sql"
          render() { ./target/release/ferroreport render fixtures/48-sql/report.jrxml -p fixtures/48-sql/params.json -q --db "$1" -o "$2"; }
          render sqlite:/tmp/fx.sqlite /tmp/sqlite.csv
          render "postgres://postgres:ci-only-pw@127.0.0.1:5432/fx" /tmp/postgres.csv
          render "mysql://root:ci-only-pw@127.0.0.1:3306/fr" /tmp/mariadb.csv
          diff /tmp/sqlite.csv /tmp/postgres.csv
          diff /tmp/sqlite.csv /tmp/mariadb.csv

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cargo clippy -p ferroreport-python -- -D warnings
      - run: pip install maturin pytest
      - run: maturin build --release -m bindings/python/Cargo.toml -o dist
      - run: pip install dist/*.whl && pytest -q bindings/python/tests

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo build --release -p ferroreport-cli
      - run: mvn -B -q -f bindings/java/pom.xml verify
        env:
          FERROREPORT_BIN: ${{ github.workspace }}/target/release/ferroreport
      # What a Maven Central release builds (sources and javadoc jars), without signing.
      - run: mvn -B -q -f bindings/java/pom.xml -Prelease -Dgpg.skip -DskipTests package

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: |
          V=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          echo "WASM_BINDGEN=wasm-bindgen-cli@$V" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.WASM_BINDGEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bindings/wasm/build.sh
      - run: node bindings/wasm/tests/smoke.mjs
      - run: node bindings/wasm/tests/designer.mjs

  # What the server promises about large reports (tools/http_check.py says what).
  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ferroreport-cli
      - run: python3 tools/http_check.py --rows 100000 --clients 20

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ferroreport:ci .
      - name: Build the image releases publish, from the same binary
        run: |
          mkdir -p dist
          docker create --name bin ferroreport:ci
          docker cp bin:/ferroreport dist/ferroreport-linux-amd64
          docker rm bin
          docker build -t ferroreport:release -f Dockerfile.release .
      - name: Smoke-test the HTTP API
        run: |
          # Without a token the server refuses to listen beyond localhost.
          if docker run --rm ferroreport:ci; then echo 'started without a token'; exit 1; fi
          for image in ferroreport:ci ferroreport:release; do
            # No memory for documents: every one goes through a file, which proves that the
            # image has somewhere to write (it is built from nothing, as a user that is not root).
            docker run -d --name fr -p 8080:8080 -e FERROREPORT_TOKEN=ci-secret -e FERROREPORT_SPOOL_MEMORY=0 $image
            for i in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
            python3 - <<'EOF'
          import json, urllib.request
          tpl = open("fixtures/01-employee-list/report.jrxml").read()
          data = json.load(open("fixtures/01-employee-list/data.json"))
          def render(body, kind, **more):
              req = urllib.request.Request("http://localhost:8080/render", method="POST", data=body,
                  headers={"Content-Type": kind, "Authorization": "Bearer ci-secret", **more})
              return urllib.request.urlopen(req).read()
          whole = render(json.dumps({"template": tpl, "now": "2026-01-15T10:30:00", "data": data}).encode(), "application/json")
          assert whole.startswith(b"%PDF"), whole[:200]
          lines = (json.dumps({"template": tpl, "now": "2026-01-15T10:30:00"}) + "\n" + "".join(json.dumps(r) + "\n" for r in data)).encode()
          assert render(lines, "application/x-ndjson") == whole
          assert render(lines, "application/x-ndjson", Prefer="respond-streaming") == whole
          print("ok", len(whole))
          EOF
            docker logs fr 2>&1 | tail -5
            if docker logs fr 2>&1 | grep -q 'no writable temporary directory'; then echo 'the image has nowhere to write'; exit 1; fi
            docker rm -f fr
          done
