# Publishes a release when a tag like v0.1.0 is pushed:
#   - CLI binaries (Linux, macOS, Windows) on the GitHub release
#   - Docker image on ghcr.io/cristianencarnacion/ferroreport
#   - npm package `ferroreport` (WebAssembly)
#   - PyPI package `ferroreport` (wheels for Linux, macOS, Windows)
#   - crates.io crates `ferroreport` and `ferroreport-cli`
#   - Maven Central library `io.github.cristianencarnacion:ferroreport`
# GitHub release and Docker image need no setup. Each registry job runs once its repository
# variable (PUBLISH_NPM, PUBLISH_PYPI, PUBLISH_CRATES, PUBLISH_MAVEN) is "true"; see RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64, docker: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-aarch64, docker: arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p ferroreport-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist pkg/ferroreport-${{ matrix.name }}
          EXE=ferroreport; [[ "${{ matrix.target }}" == *windows* ]] && EXE=ferroreport.exe
          cp target/${{ matrix.target }}/release/$EXE README.md LICENSE-MIT LICENSE-APACHE pkg/ferroreport-${{ matrix.name }}/
          cd pkg
          if [[ "$EXE" == *.exe ]]; then
            7z a ../dist/ferroreport-${{ matrix.name }}.zip ferroreport-${{ matrix.name }} >/dev/null
          else
            tar czf ../dist/ferroreport-${{ matrix.name }}.tar.gz ferroreport-${{ matrix.name }}
          fi
          cd ..
          if [ -n "${{ matrix.docker }}" ]; then cp target/${{ matrix.target }}/release/ferroreport dist/ferroreport-linux-${{ matrix.docker }}; fi
      - uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.name }}
          path: dist/*

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum ferroreport-*.tar.gz ferroreport-*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  docker:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: bin-linux-*
          merge-multiple: true
          path: dist
      - run: chmod +x dist/ferroreport-linux-*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ferroreport
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: |
          V=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          echo "WASM_BINDGEN=wasm-bindgen-cli@$V" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.WASM_BINDGEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bindings/wasm/build.sh && node bindings/wasm/tests/smoke.mjs
      # npm tries trusted publishing (OIDC) first and falls back to NPM_TOKEN.
      - name: Publish
        working-directory: bindings/wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "ferroreport@$V" version >/dev/null 2>&1; then
            echo "ferroreport@$V is already on npm"
          else
            npm publish --provenance --access public
          fi

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist -m bindings/python/Cargo.toml
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'none' }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m bindings/python/Cargo.toml
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-sdist
          path: dist

  pypi:
    if: vars.PUBLISH_PYPI == 'true'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  crates:
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Trusted publishing (configured on crates.io for release.yml in the crates-io environment).
      # The CARGO_REGISTRY_TOKEN secret is only a fallback.
      - name: Authenticate (trusted publishing)
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="ferroreport") | .version')
          published() { curl -fsS -A "ferroreport-release-workflow" "https://crates.io/api/v1/crates/$1/$V" >/dev/null 2>&1; }
          published ferroreport || cargo publish --locked -p ferroreport
          published ferroreport-cli || cargo publish --locked -p ferroreport-cli

  maven:
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # Writes the `central` server of the pom to settings.xml, and imports the signing key.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # Maven Central keeps every version forever: an existing one is left alone.
      - name: Publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          V=$(mvn -B -q -f bindings/java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          if curl -fsS -o /dev/null "https://repo1.maven.org/maven2/io/github/cristianencarnacion/ferroreport/$V/ferroreport-$V.pom"; then
            echo "ferroreport $V is already on Maven Central"
          else
            mvn -B -f bindings/java/pom.xml -Prelease -DskipTests deploy
          fi
