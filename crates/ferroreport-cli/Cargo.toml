[package]
name = "ferroreport-cli"
description = "Command-line renderer for JasperReports JRXML templates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
homepage.workspace = true
keywords = ["jasperreports", "jrxml", "pdf", "report", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "ferroreport"
path = "src/main.rs"

[dependencies]
ferroreport = { path = "../ferroreport", version = "0.4.0" }
serde_json = "1"
tiny_http = "0.12"
