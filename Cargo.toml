[workspace]
resolver = "2"
members = ["crates/ferroreport", "crates/ferroreport-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferroreport/ferroreport"
authors = ["Cristian Encarnacion"]
rust-version = "1.80"

[profile.release]
lto = "thin"
codegen-units = 1
